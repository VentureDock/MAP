<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply — VentureDock US Market Access Program</title>
<meta name="description" content="Apply for VentureDock's Market Access Program — a 12-week virtual program for international founders preparing to enter the US market.">

<!-- Primary redirect: send applicants straight to the live Fillout application
     (the form that feeds our database). Kept in ONE place so index.html and any
     bookmarks to /apply.html continue to work. To change the destination, edit
     the URL below AND the <meta http-equiv="refresh"> tag. -->
<meta http-equiv="refresh" content="0; url=https://venturedock.fillout.com/t/5vmCEd6sdtus">
<link rel="canonical" href="https://venturedock.fillout.com/t/5vmCEd6sdtus">

<style>
  @font-face { font-family:'Poppins'; src:url('assets/fonts/Poppins-Regular.ttf') format('truetype'); font-weight:400; }
  @font-face { font-family:'Poppins'; src:url('assets/fonts/Poppins-SemiBold.ttf') format('truetype'); font-weight:600; }
  @font-face { font-family:'Poppins'; src:url('assets/fonts/Poppins-ExtraBold.ttf') format('truetype'); font-weight:800; }

  :root {
    --navy: #2E3A4F;
    --ice: #F2F4F8;
    --teal: #3B706A;
    --gray: #64748B;
    --white: #FFFFFF;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:'Poppins', system-ui, sans-serif;
    background:var(--ice);
    color:var(--navy);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px; text-align:center;
  }
  .card {
    background:var(--white);
    border-radius:20px;
    padding:48px 40px;
    max-width:460px; width:100%;
    box-shadow:0 12px 40px rgba(46,58,79,.10);
  }
  .logo { height:34px; margin-bottom:28px; }
  .spinner {
    width:38px; height:38px; margin:0 auto 24px;
    border:3px solid rgba(59,112,106,.20);
    border-top-color:var(--teal);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  h1 { font-size:1.35rem; font-weight:800; margin-bottom:10px; }
  p { color:var(--gray); font-size:.95rem; line-height:1.6; margin-bottom:24px; }
  a.btn {
    display:inline-block;
    background:var(--teal); color:var(--white);
    text-decoration:none; font-weight:600; font-size:.95rem;
    padding:13px 26px; border-radius:10px;
    transition:background .15s;
  }
  a.btn:hover { background:#2d5550; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/logo-dark.png" alt="VentureDock" onerror="this.style.display='none'">
    <div class="spinner"></div>
    <h1>Taking you to the application…</h1>
    <p>You're being redirected to the VentureDock Market Access Program application. If it doesn't open automatically, use the button below.</p>
    <a class="btn" href="https://venturedock.fillout.com/t/5vmCEd6sdtus">Open the application →</a>
  </div>

  <script>
    // Immediate client-side redirect (replace() so Back doesn't trap the user
    // on this page). The <meta refresh> above is the no-JS fallback.
    window.location.replace('https://venturedock.fillout.com/t/5vmCEd6sdtus');
  </script>
</body>
</html>
